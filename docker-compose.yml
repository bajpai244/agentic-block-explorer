services:
  postgres:
    image: postgres:16
    container_name: chacha-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chacha
    ports:
      - "5432:5432"
    volumes:
      - chacha-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chacha"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  chacha-postgres-data:
